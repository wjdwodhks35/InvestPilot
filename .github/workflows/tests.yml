name: Tests
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: investpilot_test
          POSTGRES_PASSWORD: integration-test-only
          POSTGRES_DB: investpilot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U investpilot_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m pytest tests/test_cloud_storage.py tests/test_deploy.py -q
        env:
          # Disposable CI database only; production requires TLS.
          INVESTPILOT_TEST_POSTGRES_URL: postgresql://investpilot_test:integration-test-only@127.0.0.1:5432/investpilot_test?sslmode=disable
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-lab.txt pytest
      - run: python -m pytest -q
      - run: node --check app/static/comparison.js && node --check app/static/login.js && node --check app/static/auth.js
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt playwright
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/check_comparison_ui.py
      - run: python -m scripts.check_auth_ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: comparison-ui-verification
          path: data/ui-verification/
  windows-launcher:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m pytest tests/test_launcher.py -q
      - shell: pwsh
        run: |
          $ScriptTokens = $null
          $ScriptErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/run.ps1", [ref]$ScriptTokens, [ref]$ScriptErrors) | Out-Null
          if ($ScriptErrors.Count -gt 0) { throw ($ScriptErrors | Out-String) }
