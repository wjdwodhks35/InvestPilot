name: Tests
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-lab.txt pytest
      - run: python -m pytest -q
      - run: node --check app/static/comparison.js
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install httpx playwright
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/check_comparison_ui.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: comparison-ui-verification
          path: data/ui-verification/
