name: Tests
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-lab.txt pytest
      - run: python -m pytest -q
      - run: node --check app/static/comparison.js && node --check app/static/login.js && node --check app/static/auth.js
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt playwright
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/check_comparison_ui.py
      - run: python -m scripts.check_auth_ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: comparison-ui-verification
          path: data/ui-verification/
  windows-launcher:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m pytest tests/test_launcher.py -q
      - shell: pwsh
        run: |
          $ScriptTokens = $null
          $ScriptErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/run.ps1", [ref]$ScriptTokens, [ref]$ScriptErrors) | Out-Null
          if ($ScriptErrors.Count -gt 0) { throw ($ScriptErrors | Out-String) }
