# Creates paid resources only when explicitly applied in a Render account.
services:
  - type: web
    name: investpilot
    runtime: python
    branch: dev
    plan: 0.5c-512mb
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: python -m scripts.deploy
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    numInstances: 1
    disk:
      name: investpilot-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.14
      - key: INVESTPILOT_DATA_DIR
        value: /opt/render/project/src/data
      - key: INVESTPILOT_AUTH_ENABLED
        value: "true"
      - key: INVESTPILOT_AUTH_SECURE_COOKIE
        value: "true"
      - key: INVESTPILOT_INITIAL_USERNAME
        value: admin
      - key: INVESTPILOT_INITIAL_PASSWORD
        generateValue: true
      - key: TOSS_STREAM_ENABLED
        value: "false"
